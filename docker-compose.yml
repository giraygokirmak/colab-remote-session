services:
  mcp:
    build: .
    image: colab-remote-mcp:0.1.0
    restart: unless-stopped
    # Use a non-loopback public HTTPS origin only behind a trusted TLS proxy.
    # ports:
    #   - "127.0.0.1:8000:8000"
    volumes:
      - colab-oauth-keyring:/data
      - type: bind
        source: ./keyring.password
        # If the source is missing, Docker can auto-create /run/secrets/keyring.password
        # as a directory. The entrypoint stops with an actionable error, not a loop.
        target: /run/secrets/keyring.password
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/secrets:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    # Validates file type, ownership and mode before reading the passphrase in config.
    # No passphrase value is included in argv, environment or error output.
    entrypoint: ["python", "/usr/local/bin/colab-remote-keyring-entrypoint"]
    command:
      - --public-url=http://127.0.0.1:8000
      - --keyring-password-file=/run/secrets/keyring.password

volumes:
  colab-oauth-keyring:
