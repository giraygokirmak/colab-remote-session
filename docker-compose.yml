services:
  mcp:
    build: .
    image: colab-remote-mcp:0.1.0
    restart: unless-stopped
    # Non-loopback plain HTTP is intended for a trusted local tunnel/proxy only.
    ports:
      - "6012:8000"
    # The only persistent storage is this named volume. In particular, no host
    # password file, Docker socket, SSH agent or environment credential is bound.
    volumes:
      - colab-oauth-keyring:/data
    # If the volume is newly created on an existing service, reset its ownership
    # once with docker compose run --rm --user root mcp chown 10001:10001 /data.
    # New empty volumes receive uid 10001 from the Docker image automatically.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    # Creates a fresh random key at /data/secrets/keyring.password only when
    # absent, then reuses it unchanged across restarts. No host bind or prompt.
    entrypoint: ["python", "/usr/local/bin/colab-remote-keyring-entrypoint"]
    command:
      - --host=0.0.0.0
      # Missing HTTPS public origin / proxy trust still needs fixing separately.

volumes:
  colab-oauth-keyring:
