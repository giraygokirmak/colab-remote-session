[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "colab-remote-mcp"
version = "0.1.0"
description = "Ephemeral Colab execution over OAuth-enabled Streamable HTTP MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "cryptography>=46.0.3,<47",
  "google-auth-oauthlib>=1.2.3,<2",
  "google-colab-cli==0.8.0",
  "keyring>=25.7.0,<26",
  "keyrings.alt==5.0.2",
  "mcp==1.30.0",
  "pycryptodomex>=3.23.0,<4",
  "starlette>=0.49.1,<1",
  "uvicorn>=0.38.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.14.14,<1",
  "httpx>=0.28.1,<1",
]

[project.scripts]
colab-remote-mcp = "colab_remote_mcp.__main__:main"
colab-remote-secrets = "colab_remote_mcp.keyring_backend:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colab_remote_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
